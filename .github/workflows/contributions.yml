name: Contributions plate

on:
  schedule:
    - cron: "23 1 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/world/**"
      - "scripts/build_assets.py"
      - "scripts/fonts/**"
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools
        run: pip install "fonttools==4.59.2"

      - name: Render assets/activity-*.svg from the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: Chaitanaya25
        # exits non-zero on API errors or odd data and leaves the existing files untouched
        run: python scripts/build_assets.py activity

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-day.svg assets/activity-dusk.svg
          if git diff --staged --quiet; then
            echo "Activity plate unchanged."
          else
            git commit -m "chore: update activity plate [skip ci]"
            git push
          fi
